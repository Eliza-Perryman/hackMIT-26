<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexagon Shift Game</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <main class="game-shell" aria-live="polite">
      <section id="start-screen" class="screen">
        <div class="empty-state panel">
          <p class="eyebrow">Hexagon puzzle</p>
          <h1>Match the target pattern.</h1>
          <button id="start-game-button" class="primary-button" type="button">Start Game</button>
        </div>
      </section>

      <section id="mode-screen" class="screen hidden">
        <div class="panel mode-panel">
          <p class="eyebrow">Difficulty</p>
          <h2>Choose a mode</h2>
          <div class="mode-grid" aria-label="Game modes">
            <button type="button" class="mode-card" data-mode="easy">
              <span class="mode-title">Easy</span>
              <span class="mode-detail">2 active triangles</span>
            </button>
            <button type="button" class="mode-card" data-mode="difficult">
              <span class="mode-title">Difficult</span>
              <span class="mode-detail">3–4 active triangles</span>
            </button>
            <button type="button" class="mode-card" data-mode="impossible">
              <span class="mode-title">Impossible</span>
              <span class="mode-detail">5–6 active triangles</span>
            </button>
          </div>
        </div>
      </section>

      <section id="loading-screen" class="screen hidden">
        <div class="panel loading-panel">
          <p class="eyebrow">Loading</p>
          <h2>Preparing the puzzle…</h2>
          <div class="hexagon skeleton-hexagon" aria-label="Loading hexagon">
            <span class="skeleton-triangle"></span>
            <span class="skeleton-triangle"></span>
            <span class="skeleton-triangle"></span>
            <span class="skeleton-triangle"></span>
            <span class="skeleton-triangle"></span>
            <span class="skeleton-triangle"></span>
          </div>
        </div>
      </section>

      <section id="game-screen" class="screen hidden">
        <div class="panel game-panel">
          <div class="game-header">
            <div>
              <p class="eyebrow">Target pattern</p>
              <h2 id="mode-label">Easy</h2>
            </div>
            <button id="new-game-button" class="secondary-button" type="button">New Game</button>
          </div>

          <div class="game-layout">
            <aside class="goal-panel">
              <h3>Goal</h3>
              <div id="goal-hexagon" class="mini-hexagon" aria-label="Goal hexagon"></div>
            </aside>

            <div class="play-panel">
              <div class="hexagon-wrap">
                <button id="rotate-button" class="rotate-button" type="button" aria-label="Rotate hexagon clockwise">
                  <i data-lucide="rotate-cw"></i>
                </button>
                <div id="hexagon" class="hexagon" aria-label="Interactive six-triangle hexagon"></div>
              </div>
            </div>
          </div>

          <p id="status" class="status" role="status">Choose a triangle to begin.</p>
        </div>
      </section>
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>
