<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexagon Shift Game</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <main class="game-shell" aria-live="polite">
      <section id="start-screen" class="screen">
        <div class="empty-state panel">
          <p class="eyebrow">Hexagon puzzle</p>
          <h1>Match the target pattern.</h1>
          <button id="start-game-button" class="primary-button" type="button">Start Game</button>
          <div class="theme-picker" aria-label="Choose a visual theme">
            <span class="theme-label">Theme</span>
            <div class="theme-row" aria-label="Light themes">
              <span class="theme-row-label">Light</span>
              <div class="theme-options">
                <button class="theme-option is-selected" type="button" data-theme="mono" aria-label="Mono light theme" aria-pressed="true"><span class="theme-swatch"></span><span>Mono</span></button>
                <button class="theme-option" type="button" data-theme="paper" aria-label="Paper light theme" aria-pressed="false"><span class="theme-swatch"></span><span>Paper</span></button>
                
                <button class="theme-option" type="button" data-theme="ink" aria-label="Ink theme" aria-pressed="false"><span class="theme-swatch" aria-hidden="true"></span><span>Ink</span></button>

                <button class="theme-option" type="button" data-theme="sky" aria-label="Sky light theme" aria-pressed="false"><span class="theme-swatch"></span><span>Sky</span></button>
                <button class="theme-option" type="button" data-theme="mint" aria-label="Mint light theme" aria-pressed="false"><span class="theme-swatch"></span><span>Mint</span></button>
                <button class="theme-option" type="button" data-theme="sand" aria-label="Sand light theme" aria-pressed="false"><span class="theme-swatch"></span><span>Sand</span></button>
                <button class="theme-option" type="button" data-theme="rose" aria-label="Rose light theme" aria-pressed="false"><span class="theme-swatch"></span><span>Rose</span></button>
                <button class="theme-option" type="button" data-theme="lemon" aria-label="Lemon light theme" aria-pressed="false"><span class="theme-swatch"></span><span>Lemon</span></button>
                <button class="theme-option" type="button" data-theme="ocean" aria-label="Ocean light theme" aria-pressed="false"><span class="theme-swatch"></span><span>Ocean</span></button>
                <button class="theme-option" type="button" data-theme="coral" aria-label="Coral light theme" aria-pressed="false"><span class="theme-swatch"></span><span>Coral</span></button>
                <button class="theme-option" type="button" data-theme="sage" aria-label="Sage light theme" aria-pressed="false"><span class="theme-swatch"></span><span>Sage</span></button>
              </div>
            </div>
            <div class="theme-row" aria-label="Dark themes">
              <span class="theme-row-label">Dark</span>
              <div class="theme-options">
                <button class="theme-option" type="button" data-theme="midnight" aria-label="Midnight dark theme" aria-pressed="false"><span class="theme-swatch"></span><span>Midnight</span></button>
                <button class="theme-option" type="button" data-theme="graphite" aria-label="Graphite dark theme" aria-pressed="false"><span class="theme-swatch"></span><span>Graphite</span></button>
                <button class="theme-option" type="button" data-theme="forest" aria-label="Forest dark theme" aria-pressed="false"><span class="theme-swatch"></span><span>Forest</span></button>
                <button class="theme-option" type="button" data-theme="ember" aria-label="Ember dark theme" aria-pressed="false"><span class="theme-swatch"></span><span>Ember</span></button>
                <button class="theme-option" type="button" data-theme="cobalt" aria-label="Cobalt dark theme" aria-pressed="false"><span class="theme-swatch"></span><span>Cobalt</span></button>
                <button class="theme-option" type="button" data-theme="navy" aria-label="Navy dark theme" aria-pressed="false"><span class="theme-swatch"></span><span>Navy</span></button>
                <button class="theme-option" type="button" data-theme="charcoal" aria-label="Charcoal dark theme" aria-pressed="false"><span class="theme-swatch"></span><span>Charcoal</span></button>
                <button class="theme-option" type="button" data-theme="moss" aria-label="Moss dark theme" aria-pressed="false"><span class="theme-swatch"></span><span>Moss</span></button>
                <button class="theme-option" type="button" data-theme="ruby" aria-label="Ruby dark theme" aria-pressed="false"><span class="theme-swatch"></span><span>Ruby</span></button>
                <button class="theme-option" type="button" data-theme="slate" aria-label="Slate dark theme" aria-pressed="false"><span class="theme-swatch"></span><span>Slate</span></button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="mode-screen" class="screen hidden">
        <div class="panel mode-panel">
          <p class="eyebrow">Difficulty</p>
          <h2>Choose a mode</h2>
          <div class="mode-grid" aria-label="Game modes">
            <button type="button" class="mode-card" data-mode="easy">
              <span class="mode-title">Easy</span>
              <span class="mode-detail">2 active triangles</span>
            </button>
            <button type="button" class="mode-card" data-mode="difficult">
              <span class="mode-title">Difficult</span>
              <span class="mode-detail">3–4 active triangles</span>
            </button>
            <button type="button" class="mode-card" data-mode="impossible">
              <span class="mode-title">Impossible</span>
              <span class="mode-detail">5–6 active triangles</span>
            </button>
          </div>
        </div>
      </section>

      <section id="loading-screen" class="screen hidden">
        <div class="panel loading-panel">
          <p class="eyebrow">Loading</p>
          <h2>Preparing the puzzle…</h2>
          <div class="hexagon skeleton-hexagon" aria-label="Loading hexagon">
            <span class="skeleton-triangle"></span>
            <span class="skeleton-triangle"></span>
            <span class="skeleton-triangle"></span>
            <span class="skeleton-triangle"></span>
            <span class="skeleton-triangle"></span>
            <span class="skeleton-triangle"></span>
          </div>
        </div>
      </section>

      <section id="game-screen" class="screen hidden">
        <div class="panel game-panel">
          <div class="game-header">
            <div>
              <p class="eyebrow">Target pattern</p>
              <h2 id="mode-label">Easy</h2>
            </div>
            <button id="new-game-button" class="secondary-button" type="button">New Game</button>
          </div>

          <div class="game-layout">
            <aside class="goal-panel">
              <h3>Goal</h3>
              <div id="goal-hexagon" class="mini-hexagon" aria-label="Goal hexagon"></div>
            </aside>

            <div class="play-panel">
              <div class="hexagon-wrap">
                <button id="rotate-button" class="rotate-button" type="button" aria-label="Rotate hexagon clockwise">
                  <i data-lucide="rotate-cw"></i>
                </button>
                <div id="hexagon" class="hexagon" aria-label="Interactive six-triangle hexagon"></div>
              </div>
            </div>
          </div>

          <p id="status" class="status" role="status">Choose a triangle to begin.</p>
        </div>
      </section>
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>
